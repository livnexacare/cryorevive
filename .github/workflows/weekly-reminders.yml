name: Weekly Member Reminders

on:
  schedule:
    - cron: '30 13 * * 0'  # Sunday 13:30 UTC = Sunday 19:00 IST
  workflow_dispatch:        # Manual trigger anytime

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send weekly member reminders
        run: |
          set -euo pipefail
          echo "Sending member reminders..."
          RESPONSE=$(curl -sSf -X POST \
            "${{ secrets.API_URL }}/api/automation/send-member-reminders" \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}" \
            -H "Content-Type: application/json")
          echo "Response: $RESPONSE"

          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          sent = d.get('sent', [])
          print(f'Sent: {len(sent)}')
          for m in sent:
              print(f'  - {m[\"name\"]}: {m[\"sessions_remaining\"]} sessions left')
          " >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "Summary parse failed — see Response above"

      - name: Send expiry alerts
        run: |
          set -euo pipefail
          echo "Sending expiry alerts..."
          curl -sSf -X POST \
            "${{ secrets.API_URL }}/api/automation/send-expiry-alerts" \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}" \
            -H "Content-Type: application/json"
